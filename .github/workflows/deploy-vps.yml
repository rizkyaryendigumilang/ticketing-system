name: Web CI/CD to VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy web bundle to VPS after successful build'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: helpdesk-production-vps
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build production web bundle for /helpdesk/
        env:
          CI: true
        run: |
          set -euo pipefail
          echo "Building Helpdesk Ticketing System with base path /helpdesk/..."
          npm run build -- --base=/helpdesk/

      - name: Validate build output integrity
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "::error::dist/index.html is missing or empty"; exit 1; }
          grep -q '/helpdesk/assets/' dist/index.html || { echo "::error::dist/index.html is missing /helpdesk/assets/ prefix"; exit 1; }
          test -d dist/assets || { echo "::error::dist/assets directory is missing"; exit 1; }
          echo "✓ Build output passed all static path integrity checks."

      - name: Package web artifact
        run: tar -czf web-dist.tar.gz -C dist .

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps != false))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log deployment context
        run: |
          echo "=========================================="
          echo "Starting Helpdesk Production Deployment"
          echo "Commit SHA : ${GITHUB_SHA}"
          echo "Run ID     : ${GITHUB_RUN_ID}"
          echo "Attempt    : ${GITHUB_RUN_ATTEMPT}"
          echo "Ref        : ${GITHUB_REF}"
          echo "Actor      : ${GITHUB_ACTOR}"
          echo "Event      : ${GITHUB_EVENT_NAME}"
          echo "Timestamp  : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "=========================================="

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: helpdesk-web-dist
          path: ./artifact

      - name: Configure verified SSH
        id: ssh-config
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || '2222' }}
          VPS_SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${VPS_HOST:-}" ] || missing="$missing VPS_HOST"
          [ -n "${VPS_USER:-}" ] || missing="$missing VPS_USERNAME"
          [ -n "${VPS_KEY:-}" ] || missing="$missing VPS_SSH_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Deployment cannot proceed. Missing required secret(s):$missing. Configure them in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT < 65536)) || {
            echo "::error::Invalid VPS SSH port: '$VPS_PORT'. Must be an integer between 1 and 65535."
            exit 1
          }

          TARGET_PORT="$VPS_PORT"
          for test_port in "$VPS_PORT" 2222 22; do
            if nc -z -w 3 "$VPS_HOST" "$test_port" 2>/dev/null; then
              TARGET_PORT="$test_port"
              echo "Active SSH port detected: $TARGET_PORT"
              break
            fi
          done
          echo "ACTUAL_VPS_PORT=$TARGET_PORT" >> "$GITHUB_ENV"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          fi
          ssh-keyscan -p "$TARGET_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "✓ SSH configuration and host key verification established strictly."

      - name: Upload bundle to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
        run: |
          set -euo pipefail
          TARGET_PORT="${ACTUAL_VPS_PORT:-2222}"
          scp -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$TARGET_PORT" -i "$HOME/.ssh/id_deploy" ./artifact/web-dist.tar.gz "$VPS_USER@$VPS_HOST:web-dist-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          echo "✓ Web bundle uploaded successfully."

      - name: Deploy bundle atomically with backup
        id: deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_ROOT: ${{ vars.VPS_WEB_ROOT || secrets.VPS_WEB_ROOT || '/srv/www/helpdesk' }}
        run: |
          set -euo pipefail
          TARGET_PORT="${ACTUAL_VPS_PORT:-2222}"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$TARGET_PORT" -i "$HOME/.ssh/id_deploy" "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_ROOT' 'helpdesk' '${GITHUB_SHA}' '${GITHUB_RUN_ID}'" <<'REMOTE'
          set -Eeuo pipefail

          live="$1"
          slug="$2"
          release="$3"
          run_id="$4"

          # 1. Directory safety boundary & preparation
          if [ ! -d "$live" ]; then
            mkdir -p "$live" 2>/dev/null || sudo mkdir -p "$live"
            sudo chown -R "$USER:$USER" "$live" 2>/dev/null || true
          fi
          test -d "$live" && test ! -L "$live" || { echo "Target must be an existing real directory: $live"; exit 1; }

          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-${release}-${run_id}"
          backup="$parent/backup-${release}-${run_id}.tar.gz"
          mkdir -p "$parent"

          # Clean any stale staging dir from previous interrupted attempts
          rm -rf "$stage"
          mkdir -p "$stage"

          # 2. Trap for automatic rollback if atomic switch fails
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -s "$backup" ]; then echo "Deploy failed on remote. Restoring from backup..."; mkdir -p "$stage/restore"; tar -xzf "$backup" -C "$stage/restore"; rsync -a --delete "$stage/restore/" "$live/"; fi; rm -rf "$stage"; exit "$status"' ERR

          # 3. Extract and validate staged release
          tar -xzf "$HOME/web-dist-${release}-${run_id}.tar.gz" -C "$stage"
          test -s "$stage/index.html" || { echo "Staged bundle missing index.html"; exit 1; }
          test -d "$stage/assets" || { echo "Staged bundle missing assets directory"; exit 1; }

          # 4. Create isolated backup of current live release for this run (if directory is not empty)
          if [ -n "$(ls -A "$live" 2>/dev/null)" ]; then
            tar -czf "$backup" -C "$live" .
            echo "✓ Backup created: $backup"
          else
            echo "Target $live is currently empty (initial deployment); skipping backup."
          fi

          # 5. Atomically sync staging to live target
          rsync -a --delete "$stage/" "$live/"
          chmod -R u=rwX,go=rX "$live"

          # 6. Post-deployment sanity verification
          test -s "$live/index.html" || { echo "Live deployment missing index.html"; exit 1; }

          # 7. Clean temporary files
          rm -rf "$stage"
          rm -f "$HOME/web-dist-${release}-${run_id}.tar.gz"

          echo "=========================================="
          echo "✅ HELPDESK PRODUCTION DEPLOYMENT SUCCESS"
          echo "Target Directory: $live"
          echo "Commit SHA      : $release"
          echo "=========================================="
          REMOTE
