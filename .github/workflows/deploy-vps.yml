name: Web CI/CD to VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy web bundle to VPS after successful build'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: helpdesk-production-vps
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build production web bundle for /helpdesk/
        env:
          CI: true
          VITE_PB_URL: /helpdesk-pb
        run: |
          set -euo pipefail
          echo "Building Helpdesk Ticketing System with base path /helpdesk/..."
          npm run build -- --base=/helpdesk/

      - name: Validate build output integrity
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "::error::dist/index.html is missing or empty"; exit 1; }
          grep -q '/helpdesk/assets/' dist/index.html || { echo "::error::dist/index.html is missing /helpdesk/assets/ prefix"; exit 1; }
          test -d dist/assets || { echo "::error::dist/assets directory is missing"; exit 1; }
          echo "✓ Build output passed all static path integrity checks."

      - name: Package web artifact
        run: tar -czf web-dist.tar.gz -C dist .

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps != false))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: helpdesk-web-dist
          path: ./artifact

      - name: Validate secrets and deploy to VPS
        id: deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || '2222' }}
          VPS_SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_ROOT: ${{ vars.VPS_WEB_ROOT || secrets.VPS_WEB_ROOT || '/srv/www/helpdesk' }}
        run: |
          set -euo pipefail

          # 1. Strict secret validation
          missing=""
          [ -n "${VPS_HOST:-}" ] || missing="$missing VPS_HOST"
          [ -n "${VPS_USER:-}" ] || missing="$missing VPS_USERNAME"
          [ -n "${VPS_KEY:-}" ] || missing="$missing VPS_SSH_KEY"
          [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ] || missing="$missing VPS_SSH_KNOWN_HOSTS"

          if [ -n "$missing" ]; then
            echo "::error::Deployment cannot proceed. Missing required secret(s):$missing. Configure them in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          # 2. Configure SSH key and known_hosts strictly (matches wedding-planner, zero extra SYN probes)
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # 3. Upload bundle and deploy in aligned staged swap
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ARCHIVE_NAME="web-dist-${RELEASE_ID}.tar.gz"

          echo "Uploading release bundle $ARCHIVE_NAME to $VPS_USER@$VPS_HOST ..."
          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -P "$VPS_PORT" ./artifact/web-dist.tar.gz "$VPS_USER@$VPS_HOST:$ARCHIVE_NAME"

          echo "Applying release on VPS with atomic staging and verified rollback..."
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_ROOT' 'helpdesk' '$RELEASE_ID' '$ARCHIVE_NAME'" <<'REMOTE'
          set -Eeuo pipefail

          live="$1"
          slug="$2"
          release="$3"
          archive="$HOME/$4"

          # Ensure target directory exists and is writable
          if [ ! -d "$live" ]; then
            mkdir -p "$live" 2>/dev/null || sudo mkdir -p "$live"
            sudo chown -R "$USER:$USER" "$live" 2>/dev/null || true
          fi
          test -d "$live" && test ! -L "$live" || { echo "Target must be an existing real directory: $live"; exit 1; }

          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-${release}"
          backup="$parent/backup-${release}.tar.gz"
          mkdir -p "$parent"

          # Clean any stale staging dir
          rm -rf "$stage"
          mkdir -p "$stage"

          # Trap for automatic rollback if atomic switch fails
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -s "$backup" ]; then echo "Deploy failed on remote. Restoring from backup..."; mkdir -p "$stage/restore"; tar -xzf "$backup" -C "$stage/restore"; rsync -a --delete "$stage/restore/" "$live/"; fi; rm -rf "$stage"; rm -f "$archive"; exit "$status"' ERR

          # Extract and validate staged release
          tar -xzf "$archive" -C "$stage"
          test -s "$stage/index.html" || { echo "Staged bundle missing index.html"; exit 1; }
          test -d "$stage/assets" || { echo "Staged bundle missing assets directory"; exit 1; }

          # Create isolated backup of current live release
          if [ -n "$(ls -A "$live" 2>/dev/null)" ]; then
            tar -czf "$backup" -C "$live" .
            echo "✓ Backup created: $backup"
          else
            echo "Target $live is currently empty (initial deployment); skipping backup."
          fi

          # Atomically sync staging to live target
          rsync -a --delete "$stage/" "$live/"
          chmod -R u=rwX,go=rX "$live"

          # Post-deployment sanity verification
          test -s "$live/index.html" || { echo "Live deployment missing index.html"; exit 1; }

          # Housekeeping: prune old backups keeping only latest 5
          mapfile -t old_backups < <(ls -dt "$parent"/backup-*.tar.gz 2>/dev/null | tail -n +6 || true)
          for b in "${old_backups[@]:-}"; do
            [ -n "$b" ] && [ "$b" != "$backup" ] && rm -f "$b"
          done

          # Clean temporary files
          rm -rf "$stage"
          rm -f "$archive"

          echo "=========================================="
          echo "✅ HELPDESK PRODUCTION DEPLOYMENT SUCCESS"
          echo "Target Directory: $live"
          echo "Release ID      : $release"
          echo "=========================================="
          REMOTE
